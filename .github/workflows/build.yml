name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-linux-amd64
          path: libfibre-linux-amd64.so

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-linux-arm64
          path: libfibre-linux-arm64.so

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - name: Build
        run: make macos
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-macos-arm64
          path: libfibre-macos-arm64.dylib

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - name: Build
        run: make macos
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-macos-x86_64
          path: libfibre-macos-multiarch.dylib

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-pkg-config
      - name: Build
        run: |
          set -euo pipefail
          g++ -shared -o libfibre-windows-amd64.dll -std=c++11 -I./include \
            $(pkg-config --cflags libusb-1.0) \
            -DFIBRE_COMPILE -DFIBRE_ENABLE_CLIENT \
            libfibre.cpp platform_support/libusb_transport.cpp \
            legacy_protocol.cpp legacy_object_client.cpp logging.cpp \
            -static $(pkg-config --libs --static libusb-1.0)
          strip --strip-all libfibre-windows-amd64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-windows-amd64
          path: libfibre-windows-amd64.dll

  # Cross-compiles windows-arm64 from an x64 runner: native clang64 toolchain
  # targeting aarch64-w64-windows-gnu with the MSYS2 target sysroot for
  # aarch64 (/opt/clang-aarch64). The CLANGARM64 environment cannot be used
  # here — its binaries are ARM64 executables that can't run on x64 runners.
  build-windows-arm64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-aarch64-headers
            mingw-w64-clang-aarch64-crt
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-libunwind
            mingw-w64-clang-aarch64-libusb
            mingw-w64-clang-aarch64-winpthreads
            pkg-config
      - name: Build
        run: |
          set -euo pipefail
          # MSYS2 installs clang-aarch64 target packages under /opt/clang-aarch64
          PREFIX=/opt/clang-aarch64
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          clang++ --target=aarch64-w64-windows-gnu \
            -isystem $PREFIX/include/c++/v1 \
            -isystem $PREFIX/include \
            -L$PREFIX/lib \
            -stdlib=libc++ \
            -shared -o libfibre-windows-arm64.dll -std=c++11 -I./include \
            $(pkg-config --cflags libusb-1.0) \
            -DFIBRE_COMPILE -DFIBRE_ENABLE_CLIENT \
            libfibre.cpp platform_support/libusb_transport.cpp \
            legacy_protocol.cpp legacy_object_client.cpp logging.cpp \
            -static $(pkg-config --libs --static libusb-1.0) \
            -lc++ -lc++abi
          llvm-strip --strip-all libfibre-windows-arm64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-windows-arm64
          path: libfibre-windows-arm64.dll

  release:
    needs: [build-linux, build-linux-arm64, build-macos-arm64, build-macos-x86_64, build-windows, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libfibre-linux-amd64.so
            libfibre-linux-arm64.so
            libfibre-macos-arm64.dylib
            libfibre-macos-multiarch.dylib
            libfibre-windows-amd64.dll
            libfibre-windows-arm64.dll
