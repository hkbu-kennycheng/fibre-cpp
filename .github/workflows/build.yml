name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-linux-amd64
          path: libfibre-linux-amd64.so

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - name: Build
        run: make macos
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-macos-arm64
          path: libfibre-macos-arm64.dylib

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - name: Build
        run: make macos
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-macos-x86_64
          path: libfibre-macos-multiarch.dylib

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-pkg-config
      - name: Build
        run: |
          set -euo pipefail
          g++ -shared -o libfibre-windows-amd64.dll -std=c++11 -I./include \
            $(pkg-config --cflags libusb-1.0) \
            -DFIBRE_COMPILE -DFIBRE_ENABLE_CLIENT \
            libfibre.cpp platform_support/libusb_transport.cpp \
            legacy_protocol.cpp legacy_object_client.cpp logging.cpp \
            -static $(pkg-config --libs --static libusb-1.0)
          strip --strip-all libfibre-windows-amd64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libfibre-windows-amd64
          path: libfibre-windows-amd64.dll

  release:
    needs: [build-linux, build-macos-arm64, build-macos-x86_64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libfibre-linux-amd64.so
            libfibre-macos-arm64.dylib
            libfibre-macos-multiarch.dylib
            libfibre-windows-amd64.dll
